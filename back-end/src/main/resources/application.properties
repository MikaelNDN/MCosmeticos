# ===============================
# PORTA DINÂMICA DO RENDER
# ===============================
server.port=${PORT:8080}

# ===============================
# BANCO DE DADOS (POSTGRESQL - SUPABASE / LOCAL)
# ===============================
# Adicionado fallback para rodar no localhost caso a variável não exista
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mcosmeticos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:adminpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ===============================
# VIRTUAL THREADS (JAVA 21)
# ===============================
spring.threads.virtual.enabled=true

# ===============================
# CLOUDINARY
# ===============================
# Fallbacks provisórios para o Maven não falhar na inicialização
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:demo_cloud}
cloudinary.api_key=${CLOUDINARY_API_KEY:000000000}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:demo_secret}

# ===============================
# UPLOAD DE ARQUIVOS
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ===============================
# SEGURANÇA E INTEGRAÇÕES
# ===============================
# O fallback do segredo resolve o erro do TokenService no terminal
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:chave_secreta_local_para_desenvolvimento_123}
