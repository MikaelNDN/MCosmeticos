version: '3.8'

services:
  # 1. O BANCO DE DADOS POSTGRESQL
  db:
    image: postgres:17
    container_name: mcosmeticos-db
    environment:
      POSTGRES_DB: mcosmeticos_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      # Removido o POSTGRES_HOST_AUTH_METHOD: trust para forçar autenticação segura por senha
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. A SUA API SPRING BOOT
  api:
    build: . # Lê o Dockerfile que acabamos de criar
    container_name: mcosmeticos-api
    ports:
      - "8080:8080"
    depends_on:
      - db # A API só sobe depois que o banco estiver pronto
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/mcosmeticos_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=adminpassword

      # Preenchido com uma chave segura para evitar que a aplicação recuse iniciar
      - API_SECURITY_TOKEN_SECRET=sua_chave_secreta_super_forte_e_longa_aqui_123456

      - CLOUDINARY_CLOUD_NAME=ijmb6qad
      - CLOUDINARY_API_KEY=378133895392397
      - CLOUDINARY_API_SECRET=J2Ox6ohacGUbb6O_mVA1i3Y4OEI
      - WHATSAPP_LOJA_NUMERO=5583999999999

volumes:
  postgres_data: # Garante que os dados do banco não sumam se o container reiniciar